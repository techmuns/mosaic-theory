<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <script>
    /* Set the theme before first paint — no flash of the wrong palette. A saved choice wins,
       otherwise follow the OS. The sidebar toggle (app.js) flips + persists this same attribute. */
    (function () {
      try {
        var t = localStorage.getItem("nv-theme");
        if (t !== "light" && t !== "dark") {
          t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", t);
        /* the menu rail: collapsed when the reader last left it collapsed (app.js toggles it) */
        if (localStorage.getItem("nv-nav") === "collapsed") {
          document.documentElement.setAttribute("data-nav", "collapsed");
        }
      } catch (e) {}
    })();
  </script>
  <title>Nostra Vinci · research &amp; decision ops</title>
  <link rel="stylesheet" href="./assets/styles.css" />
</head>
<body>
  <div class="app">
    <nav class="sidebar" id="sidebar"></nav>
    <main class="main" id="main"></main>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
