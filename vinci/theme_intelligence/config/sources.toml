# Theme-intelligence source channels — EDITABLE CONFIGURATION, not code.
#
# SIX active publishers (decision 2026-10-13): Citi, J.P. Morgan, TrendForce and SemiAnalysis are
# read automatically (hybrid where a report must be supplied); Morgan Stanley and Goldman Sachs
# are MANUAL-FIRST (`mode = "manual_first"`: a lightweight health check only, no discovery or
# retrieval — their research arrives as authorised uploads). Bank of America (2026-10-11) and
# Nomura (2026-10-13) are RETIRED ([[retired]] below): no discovery, no health check, no intake,
# no new evidence; their historical records stay in the registry as provenance.
#
# One [[source]] per monitored channel. `entry_url` is the canonical entry point the brief names;
# `adapter` selects the discovery strategy in `vinci/theme_intelligence/discovery.py` (a strategy
# per publisher layout, never a per-article special case). `expect_blocked` marks a channel whose
# refusal is a STANDING, documented limitation: it is still attempted and reported BLOCKED every
# run, but does not by itself mark the run PARTIAL. `max_date_checks` caps how many undated
# candidates per run are fetched to read their own publication date. `reliability` is a FACE-VALIDITY tier
# (high | medium | low) for what KIND of document the channel publishes — never tuned on outcomes.
# `default_article_class` is what the channel publishes unless the page itself says otherwise.
# `min_crawl_delay_s` is our own politeness floor; a robots.txt Crawl-delay above it wins.
#
# Access state as PROBED 2026-10-09 with the honest User-Agent in config.py (no spoofing, ever):
#   citi_must_c       200 (articles in the page's __NEXT_DATA__ contentMap; robots.txt answers 403)
#   jpm_tmt           200 (listing + sitemap with lastmod; robots Crawl-delay 10 for AI agents)
#   ms_research       CONNECTION DROPPED on every request incl. robots.txt  -> BLOCKED
#   nomura_connects   200 (/articles/ listing, paginated p2..pN; no feed; robots.txt 404)
#                          — RETIRED 2026-10-13: full reports on its client portal, no public sign-up
#   trendforce        200 (press-news listing, dated URLs; sitemap with lastmod)
#   semianalysis      200 (site links its newsletter; newsletter RSS is the live feed;
#                          semianalysis.com robots Crawl-delay 100 — so the feed is read directly;
#                          paid posts carry only a preview and are recorded PARTIAL)
#   gs_research       403 Access Denied on entry, sitemap and insights  -> BLOCKED
#
# `linked_reports`: what to do when a page says it summarises a fuller report it links to.
#   "fetch"   — read the report through the polite fetcher (robots.txt obeyed, honest UA, never
#               an authenticated / paid / client-portal route) as a fuller VERSION of the same
#               article. Setting it is the operator's statement that the publisher makes those
#               reports public on its own site and they may be processed like the page itself.
#               Bounded by `max_linked_reports` per run (long documents: LLM cost).
#   "request" — (default) list the report for an authorised upload (`ingest-file`).
# `paywalled_posts`: a paid post whose page carries only its free preview.
#   "request"      — (default) list the full post for an authorised upload.
#   "preview_only" — the operator's decision that the preview is all the channel gives (no
#                    subscription): analysed as the preview it is, still PARTIAL, never requested.
# `manual_llm_processing`: may a MANUALLY SUPPLIED document of this channel go to the
#   third-party LLM? permitted | not_permitted | unknown (default — the document is HELD unless
#   the operator states, per document, that its licence allows it: `--llm-permitted`).

[[source]]
id = "citi_must_c"
publisher = "Citi"
channel = "Citi Must C (Citi Research public insights)"
entry_url = "https://www.citigroup.com/global/insights/must-c"
adapter = "citi_next_data"
# each Must C page links its report as a public PDF on ir.citi.com ("Download Here")
linked_reports = "fetch"
max_linked_reports = 2
reliability = "medium"
default_article_class = "publisher_commentary"
min_crawl_delay_s = 5


[[source]]
id = "jpm_tmt"
publisher = "J.P. Morgan Private Bank"
channel = "J.P. Morgan Top Market Takeaways"
entry_url = "https://privatebank.jpmorgan.com/apac/en/insights/markets-and-investing/tmt"
adapter = "jpm_tmt"
sitemap_url = "https://privatebank.jpmorgan.com/apac/en/sitemap.xml"
reliability = "medium"
default_article_class = "publisher_commentary"
min_crawl_delay_s = 10

[[source]]
id = "ms_research"
publisher = "Morgan Stanley"
channel = "Morgan Stanley Research"
entry_url = "https://www.morganstanley.com/what-we-do/research"
adapter = "generic_listing"
link_pattern = "^https://www\\.morganstanley\\.com/(ideas|insights)/"
expect_blocked = true
mode = "manual_first"
reliability = "high"
default_article_class = "institutional_research"
min_crawl_delay_s = 10

[[source]]
id = "trendforce"
publisher = "TrendForce"
channel = "TrendForce press center news"
entry_url = "https://www.trendforce.com/presscenter/news"
adapter = "trendforce_press"
max_listing_pages = 4
reliability = "high"
default_article_class = "industry_data_report"
min_crawl_delay_s = 5

[[source]]
id = "semianalysis"
publisher = "SemiAnalysis"
channel = "SemiAnalysis (site + its newsletter feed)"
entry_url = "https://semianalysis.com/"
adapter = "semianalysis_feed"
feed_url = "https://newsletter.semianalysis.com/feed"
# operator decision 2026-10-13: no paid subscription — paid posts are read as their free preview
# (still PARTIAL) and never requested for upload
paywalled_posts = "preview_only"
reliability = "medium"
default_article_class = "independent_research"
min_crawl_delay_s = 10

[[source]]
id = "gs_research"
publisher = "Goldman Sachs"
channel = "Goldman Sachs Research insights"
entry_url = "https://www.goldmansachs.com/insights/goldman-sachs-research/"
adapter = "generic_listing"
link_pattern = "^https://www\\.goldmansachs\\.com/insights/articles/"
expect_blocked = true
mode = "manual_first"
reliability = "high"
default_article_class = "institutional_research"
min_crawl_delay_s = 10

# RETIRED channels: never discovered, health-checked, queued or imported again. Kept so that
# records written while they were active stay attributable (their articles, versions, theses and
# runs are history, never rewritten), and so that a URL on their hosts is refused, not analysed
# as an unknown source.
[[retired]]
id = "bofa_institutional"
publisher = "Bank of America"
retired = "2026-10-11"
reason = "removed from the approved publisher list by the operator (2026-10-11)"
hosts = ["business.bofa.com"]

[[retired]]
id = "nomura_connects"
publisher = "Nomura"
retired = "2026-10-13"
# its full reports sit on the Nomura client portal (go.nomuranow.com), which offers no public
# sign-up — they could never be supplied
reason = "removed from the approved publisher list by the operator (2026-10-13)"
hosts = ["nomuraconnects.com", "nomuranow.com"]
