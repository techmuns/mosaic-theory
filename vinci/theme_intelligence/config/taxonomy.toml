# Controlled vocabulary for thesis IDENTITY — editable configuration.
#
# A thesis is keyed by (value-chain node, profit mechanism, direction, geography). The extractor
# must pick a node and a mechanism from these lists; anything else comes back as `other` and the
# thesis is created REVIEW_NEEDED — never merged by similarity. Nodes are hierarchical by dotted
# path: a parent (`ai_infrastructure`) and a child (`ai_infrastructure.memory`) are DIFFERENT
# economics and are never merged; they are linked PARENT_CHILD.
#
# Adding a node or mechanism is a deliberate edit. Renaming one re-keys every thesis that uses it,
# so do not rename — add, and archive the old one.

