# Four more therapy areas (2026-10-15, review lead U46): with only the four above, a thesis on
# immunology, vaccines or Lp(a) named no segment and took the BARE key — the key the pilot's
# in-vivo gene-editing thesis held, so the next such article would have updated it silently.
[[segment]]
node = "healthcare.pharma_biotech"
id = "genetic_medicine"
label = "Genetic medicine (gene editing, gene therapy)"
terms = ["gene editing", "gene-editing", "base editing", "prime editing", "CRISPR",
         "gene therapy", "gene therapies", "genetic medicine", "genetic medicines", "RNA editing"]

[[segment]]
node = "healthcare.pharma_biotech"
id = "immunology"
label = "Immunology (autoimmune and inflammatory disease)"
terms = ["immunology", "autoimmune", "autoimmunity", "IL-23", "IL-17", "TL1A", "psoriasis",
         "atopic dermatitis", "rheumatoid arthritis", "inflammatory bowel disease", "IBD",
         "Crohn's", "ulcerative colitis", "lupus"]

[[segment]]
node = "healthcare.pharma_biotech"
id = "vaccines"
label = "Vaccines"
terms = ["vaccine", "vaccines", "vaccination", "vaccinations", "immunization", "RSV",
         "pneumococcal"]

# Its terms are the LIPID drug classes' own: "cardiovascular", "heart failure" and
# "cholesterol" are also the outcome vocabulary of GLP-1 theses (semaglutide's cardiovascular
# and heart-failure readouts), which would have re-keyed an obesity thesis (review, 2026-10-15).
[[segment]]
node = "healthcare.pharma_biotech"
id = "cardiovascular"
label = "Cardiovascular (lipids, Lp(a))"
terms = ["Lp(a)", "Lp(a)-lowering", "lipoprotein(a)", "LDL", "LDL-C", "PCSK9", "lipid-lowering",
         "cholesterol-lowering", "statin", "statins", "atherosclerosis",
         "hypercholesterolemia"]

# PRODUCTS — finer than segments, for CLAIM-level contradiction checks (contradiction.py): two
# claims contradict only when they speak about the same product, variable, period and geography
# with opposite directions. Read from the verbatim quote (and the claim's metric / scope); the
# most specific term wins ("conventional DRAM" is not the generic "DRAM"). `covers`: the
# specific products a generic term spans — a generic claim against one of them is AMBIGUOUS.

[[product]]
node = "ai_infrastructure.memory"
id = "hbm"
label = "HBM"
terms = ["HBM", "HBM3", "HBM3E", "HBM4", "HBM4E", "high-bandwidth memory",
         "high bandwidth memory"]

[[product]]
node = "ai_infrastructure.memory"
id = "conventional_dram"
label = "Conventional DRAM"
terms = ["conventional DRAM", "commodity DRAM", "standard DRAM", "DDR4", "DDR5", "LPDDR",
         "LPDDR4", "LPDDR4X", "LPDDR5", "LPDDR5X", "GDDR6", "GDDR7", "server DRAM", "PC DRAM",
         "mobile DRAM", "graphics DRAM", "RDIMM"]

[[product]]
node = "ai_infrastructure.memory"
id = "dram"
label = "DRAM (generic)"
terms = ["DRAM"]
covers = ["hbm", "conventional_dram"]

[[product]]
node = "ai_infrastructure.memory"
id = "nand_flash"
label = "NAND Flash"
terms = ["NAND", "NAND Flash", "NAND wafer", "NAND wafers", "flash", "QLC", "TLC"]

[[product]]
node = "ai_infrastructure.memory"
id = "enterprise_ssd"
label = "Enterprise SSD"
terms = ["enterprise SSD", "enterprise SSDs", "eSSD", "data-center SSD", "datacenter SSD"]

[[product]]
node = "ai_infrastructure.memory"
id = "client_ssd"
label = "Client SSD"
terms = ["client SSD", "client SSDs", "PC SSD", "consumer SSD"]

[[product]]
node = "ai_infrastructure.memory"
id = "ssd"
label = "SSD (generic)"
terms = ["SSD", "SSDs"]
covers = ["enterprise_ssd", "client_ssd"]

[[product]]
node = "ai_infrastructure.memory"
id = "emmc_ufs"
label = "eMMC / UFS"
terms = ["eMMC", "UFS"]

[[product]]
node = "ai_infrastructure.power_grid"
id = "grid_utilities"
label = "Grid-connected utilities"
terms = ["utility", "utilities", "ratepayer", "ratepayers", "rate base"]

