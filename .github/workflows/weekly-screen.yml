name: weekly-screen

# ONE CALL IS THE WHOLE WEEK: refresh EOD for the stored universe, rebuild the universe, run
# Screen 2, scan for structural disqualifiers, rank, export, and commit the JSONL snapshots.
# MANUAL TRIGGER ONLY — the operator's ruling, 2026-08-24. There was never a sanctioned cron here:
# the schedule arrived with "Loop 1 step 8: configure-once scheduled automation" (274339a,
# 2026-06-17) and ran unasked every Monday since, pushing SIX automated commits to main. A job that
# rebuilds the universe, re-screens it, re-ranks the queue and commits the result is a DECISION
# SURFACE moving on a timer — the operator decides when the fund's queue advances, not the clock.
#
# `workflow_dispatch` keeps the one-call convenience (Actions -> weekly-screen -> Run workflow), and
# `vinci run-weekly` remains the same single command locally.
on:
  workflow_dispatch: {} # OPERATOR-TRIGGERED ONLY — see the note above; no schedule, deliberately

permissions:
  contents: write # to commit the refreshed snapshots back

concurrency:
  group: vinci-scheduled # weekly + monthly never race on the snapshot commit
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # FULL HISTORY, for the same reason gate.yml takes it — and here it is load-bearing,
          # because the pre-push gate below is the ONLY gate this commit gets. Several pins read
          # real historical blobs (`test_state_identifiers` reads `c112f25:STATE.md`;
          # `test_scheduled_workflows` reads the incident workflow out of `607e7d1`) and SKIP on a
          # shallow clone. At the default depth 1 this job would run a quietly WEAKER suite than
          # every PR does — "passes everywhere except where it matters", which is the exact shape
          # of the defect this file is being changed to close. Review finding, #456.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # `[dev]` for the pre-push gate below — this job now runs the offline suite itself.
          python -m pip install -e ".[dev]"

      # Immutable per-day grouped-daily responses are cached, so only new days hit the network.
      - name: Restore EOD cache
        uses: actions/cache@v4
        with:
          path: data/cache
          key: vinci-eod-cache-${{ github.run_id }}
          restore-keys: vinci-eod-cache-

      - name: Run weekly screen
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        # ONE CALL IS THE WHOLE WEEK — universe rebuild, screen, structural scan, rank, export.
        # Deliberately flagless: every stage is unconditional inside run_weekly(). Opt-in pieces on
        # a cron are exactly how two stages went silently missing for months — nothing ranked (the
        # served queue froze 12 days behind its own screen) and nothing scanned for structural
        # disqualifiers (0 flags across 284 names). See STATE.md §5.
        run: python -m vinci run-weekly

      # THE DERIVED MIRROR MOVES WITH THE DATA IT MIRRORS. `frontend/` is rebuilt from committed
      # data and gate.yml fails a stale one, so a scheduled commit that refreshed the snapshots and
      # left the mirror behind would red every PR that came after it — the same misattribution the
      # skipped gate below used to cause. Reads committed data only: no store, no keys, no network,
      # and it SKIPS every local-only source rather than deleting that source's mirror.
      - name: Rebuild the derived frontend mirror
        run: python frontend/build.py

      # THE SECOND DERIVED MIRROR. The step above rebuilds `frontend/` because it mirrors the data
      # this job just refreshed; `tests/fixtures/prices/` is the OTHER mirror of that same data and
      # was never rebuilt with it, which is half of why the weekly run could not go green.
      #
      # `tests/test_maintenance_path.py::_cfg` builds its store from these committed bars on EVERY
      # machine — deliberately, so the maintenance pins mean the same thing in CI as on a laptop
      # (they passed on every laptop while main ran red for eleven merges). The consequence is that
      # the gate below compares the freshly-screened fleet as-of against THESE bars, not against the
      # store. Refresh the store and leave the fixture behind, and the run fails its own gate.
      #
      # DERIVED DATA, NOT CODE, and the distinction is the one CLAUDE.md draws: these are
      # regenerable price bars carrying no analytical claim and no logic, staged by directory name
      # so this cannot become a door for a code change. The script is ALL-OR-NOTHING — a name with
      # no bars aborts before anything is written — so a partial build can never be committed.
      - name: Rebuild the price fixture, the other mirror of the refreshed store
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: PYTHONPATH=$PWD python scripts/build_price_fixture.py

      # THE ARTIFACT-PASS RULE, APPLIED TO THE PASS THAT IS NOT A HUMAN'S.
      #
      # This job's commit is the one that changes the fleet's ROUTING — a name leaving the candidate
      # band takes the MAINTENANCE route, which needs committed price bars — and until 2026-08-14 it
      # was the one commit nothing gated. On 2026-08-10 it moved NCNO onto that route with no
      # fixture, and five maintenance pins then failed ON EVERY OPEN PR REGARDLESS OF ITS CONTENTS;
      # a docs-only PR went red identically to a code one, and main's own last gate had run BEFORE
      # the push and stayed green. So the breakage read as the innocent PR's regression.
      #
      # THIS IS THE ONLY GATE THIS COMMIT GETS — there is no second one downstream. A push
      # authenticated with the workflow's own GITHUB_TOKEN does not create a new workflow run
      # (GitHub's anti-recursion rule; only workflow_dispatch and repository_dispatch are exempt),
      # so `gate.yml`'s `on: push` will NOT fire for the commit below whatever its message says.
      # Removing `[skip ci]` therefore deletes a marker that was never doing the work — it is kept
      # out because it would suppress the gate for real the day this push moves to an App/PAT
      # token, and because a marker that claims a gate is being skipped when none would have run is
      # a lie in the record. THE GATING HAPPENS HERE OR NOWHERE. Review finding, #456.
      #
      # SO IT RUNS gate.yml's THREE CHECKS, in gate.yml's order, and that file's standing rule
      # applies to this block too: if you change one, change the other.
      #
      # THE STORE IS MOVED ASIDE FIRST so this runs under the conditions gate.yml runs under. A
      # populated `data/vinci.db` makes some pins mean something different here than on main — the
      # property that let the maintenance-path pins pass on every laptop while main ran red for
      # eleven consecutive merges. Nothing below this step reads it.
      - name: Gate the refreshed artifacts before they can reach main
        run: |
          if [ -f data/vinci.db ]; then mv data/vinci.db "$RUNNER_TEMP/vinci.db"; fi
          python -m ruff check vinci tests frontend
          python -m mypy --strict vinci
          python -m pytest -m "not network" -p no:warnings --tb=short

      - name: Commit refreshed snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/snapshots frontend tests/fixtures/prices
          git diff --staged --quiet || git commit -m "weekly screen: refresh snapshots"
          git push

      # THE RUN REPORTS ITS OWN OUTCOME — A DELIBERATE, NAMED EXCEPTION TO THE GATE ABOVE.
      #
      # WHY IT EXISTS. The frontend reads COMMITTED snapshots and nothing else, so a run that fails
      # commits nothing and is INDISTINGUISHABLE from a run nobody started. That blind spot cost
      # four weeks: 2026-08-03 through 08-24 all failed, the served queue sat frozen, and the only
      # trace was in the Actions tab. The queue-age chip on the ranker could say the queue was old;
      # it could never say an attempt had been made and broken.
      #
      # WHY IT IS ALLOWED PAST THE GATE, stated so nobody has to infer it. The gate exists to stop
      # bad DATA reaching main. This step writes ONE machine-generated file carrying no analytical
      # claim — an attempt time, an outcome, and the step that failed. It stages `run_status.json`
      # BY NAME and nothing else, so a red run cannot smuggle its half-built snapshots out through
      # this door. A system that cannot report its own state is not safer for it.
      #
      # `if: always()` — the whole point is the FAILING case. `--rebase` because a green run has
      # already pushed above.
      - name: Report the run's outcome
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          import json, os, pathlib
          from datetime import UTC, datetime
          # CANCELLED IS NOT FAILED (review, #495). `job.status` is one of success / failure /
          # cancelled, and folding the third into "failure" publishes a red chip telling the
          # operator to fix a cause that does not exist — for a run THEY stopped. It is passed
          # through as its own conclusion, and the consumer treats anything that is not "success"
          # as not-healthy without claiming it broke.
          status = os.environ["JOB_STATUS"]
          remedy = {
              "success": "",
              "cancelled": "the run was cancelled before it finished — nothing was committed; "
                           "re-trigger when ready: Actions -> weekly-screen -> Run workflow",
          }.get(status,
                "Open the run log, fix the cause, then re-trigger: Actions -> weekly-screen -> "
                "Run workflow. If the gate failed on a stale fixture, RUNBOOKS.md step 5 "
                "regenerates both fixtures.")
          pathlib.Path("data/snapshots/run_status.json").write_text(json.dumps({
              "job": "weekly-screen",
              "attempted_at": datetime.now(UTC).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "conclusion": status,
              "run_url": f"{os.environ['SERVER']}/{os.environ['REPO']}/actions/runs/{os.environ['RUN_ID']}",
              # NAMED, not inferred: the remediation a human would otherwise dig out of the log.
              "remediation": remedy,
          }, indent=2) + "\n")
          PY
          git add data/snapshots/run_status.json
          git diff --staged --quiet && exit 0
          git commit -m "weekly screen: run status ($JOB_STATUS)"
          git pull --rebase --autostash
          git push
        env:
          JOB_STATUS: ${{ job.status }}
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
