name: weekly-screen

# Configure once, runs forever: every Monday it refreshes EOD prices for the stored universe,
# runs Screen 2, and commits the updated JSONL snapshots back. No manual re-runs.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch: {} # also runnable on demand

permissions:
  contents: write # to commit the refreshed snapshots back

concurrency:
  group: vinci-scheduled # weekly + monthly never race on the snapshot commit
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # FULL HISTORY, for the same reason gate.yml takes it — and here it is load-bearing,
          # because the pre-push gate below is the ONLY gate this commit gets. Several pins read
          # real historical blobs (`test_state_identifiers` reads `c112f25:STATE.md`;
          # `test_scheduled_workflows` reads the incident workflow out of `607e7d1`) and SKIP on a
          # shallow clone. At the default depth 1 this job would run a quietly WEAKER suite than
          # every PR does — "passes everywhere except where it matters", which is the exact shape
          # of the defect this file is being changed to close. Review finding, #456.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # `[dev]` for the pre-push gate below — this job now runs the offline suite itself.
          python -m pip install -e ".[dev]"

      # Immutable per-day grouped-daily responses are cached, so only new days hit the network.
      - name: Restore EOD cache
        uses: actions/cache@v4
        with:
          path: data/cache
          key: vinci-eod-cache-${{ github.run_id }}
          restore-keys: vinci-eod-cache-

      - name: Run weekly screen
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        # ONE CALL IS THE WHOLE WEEK — universe rebuild, screen, structural scan, rank, export.
        # Deliberately flagless: every stage is unconditional inside run_weekly(). Opt-in pieces on
        # a cron are exactly how two stages went silently missing for months — nothing ranked (the
        # served queue froze 12 days behind its own screen) and nothing scanned for structural
        # disqualifiers (0 flags across 284 names). See STATE.md §5.
        run: python -m vinci run-weekly

      # THE DERIVED MIRROR MOVES WITH THE DATA IT MIRRORS. `frontend/` is rebuilt from committed
      # data and gate.yml fails a stale one, so a scheduled commit that refreshed the snapshots and
      # left the mirror behind would red every PR that came after it — the same misattribution the
      # skipped gate below used to cause. Reads committed data only: no store, no keys, no network,
      # and it SKIPS every local-only source rather than deleting that source's mirror.
      - name: Rebuild the derived frontend mirror
        run: python frontend/build.py

      # THE ARTIFACT-PASS RULE, APPLIED TO THE PASS THAT IS NOT A HUMAN'S.
      #
      # This job's commit is the one that changes the fleet's ROUTING — a name leaving the candidate
      # band takes the MAINTENANCE route, which needs committed price bars — and until 2026-08-14 it
      # was the one commit nothing gated. On 2026-08-10 it moved NCNO onto that route with no
      # fixture, and five maintenance pins then failed ON EVERY OPEN PR REGARDLESS OF ITS CONTENTS;
      # a docs-only PR went red identically to a code one, and main's own last gate had run BEFORE
      # the push and stayed green. So the breakage read as the innocent PR's regression.
      #
      # THIS IS THE ONLY GATE THIS COMMIT GETS — there is no second one downstream. A push
      # authenticated with the workflow's own GITHUB_TOKEN does not create a new workflow run
      # (GitHub's anti-recursion rule; only workflow_dispatch and repository_dispatch are exempt),
      # so `gate.yml`'s `on: push` will NOT fire for the commit below whatever its message says.
      # Removing `[skip ci]` therefore deletes a marker that was never doing the work — it is kept
      # out because it would suppress the gate for real the day this push moves to an App/PAT
      # token, and because a marker that claims a gate is being skipped when none would have run is
      # a lie in the record. THE GATING HAPPENS HERE OR NOWHERE. Review finding, #456.
      #
      # SO IT RUNS gate.yml's THREE CHECKS, in gate.yml's order, and that file's standing rule
      # applies to this block too: if you change one, change the other.
      #
      # THE STORE IS MOVED ASIDE FIRST so this runs under the conditions gate.yml runs under. A
      # populated `data/vinci.db` makes some pins mean something different here than on main — the
      # property that let the maintenance-path pins pass on every laptop while main ran red for
      # eleven consecutive merges. Nothing below this step reads it.
      - name: Gate the refreshed artifacts before they can reach main
        run: |
          if [ -f data/vinci.db ]; then mv data/vinci.db "$RUNNER_TEMP/vinci.db"; fi
          python -m ruff check vinci tests frontend
          python -m mypy --strict vinci
          python -m pytest -m "not network" -p no:warnings --tb=short

      - name: Commit refreshed snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/snapshots frontend
          git diff --staged --quiet || git commit -m "weekly screen: refresh snapshots"
          git push
