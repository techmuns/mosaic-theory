name: validate-keys

# On-demand check that the API-key SECRETS are set + valid in GitHub Actions, WITHOUT running
# the pipeline. Cheap (one trivial ping per service), no commits, no side effects. Run it from the
# Actions tab ("Run workflow") any time — e.g. after rotating a key. Required keys (Polygon,
# Anthropic, the four R2 values) failing turns the run red, and so does an optional value that is
# SET and refused (Tiingo; SEC_USER_AGENT, checked against vinci's own rule with no request sent —
# fix request 2, RE1-D17). Every secret a workflow reads is checked here
# (tests/test_theme_intelligence_open_leads.py).
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # R2's HeadBucket is signed by vinci/facts/sigv4.py, loaded by path: standard library only,
      # so the S3 check needs nothing beyond httpx (no boto3).
      # The lock's packages, never `vinci` itself (the script cannot import it), so the key is
      # pinged by the SDK the pipelines pin, not the newest one (operator, 2026-11-13).
      - name: Install the locked packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock
      - name: Validate keys (values never printed)
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python .github/scripts/validate_keys.py
