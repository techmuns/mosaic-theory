name: gate

# THE OFFLINE GATE, ENFORCED WHERE A REVIEWER CAN SEE IT.
#
# WHY THIS EXISTS: the gate already existed as `bin/commit` (ruff + mypy --strict + pytest), but it
# ran on the AUTHOR's machine and reached the reviewer only as a claim pasted into a PR body. This
# repo's own rule is "verify by showing real runs, not asserting" — a green line in a description is
# an assertion. A docs-only PR could carry the same sentence while failing the real gate and nothing
# would contradict it. Review finding on #318.
#
# THE SAME COMMANDS `bin/commit` RUNS, in the same order, so there is one gate and not two that can
# drift. If you change one, change the other.
#
# WHAT THIS RUNNER DOES NOT HAVE, deliberately: the licensed CIQ workbooks (`data/manual/ciq/`), the
# working SQLite store (`data/vinci.db`), and any API key. Those are git-ignored by a security
# non-negotiable and MUST NOT be reconstructed here — no secrets are referenced by this file. Tests
# needing them SKIP with a stated reason, which is the house convention (`test_no_backfill.py`).
# Measured on a committed-files-only tree: 1,513 pass, 51 skip, 0 fail.
#
# SO THIS IS A FLOOR, NOT A REPLACEMENT. The CIQ-bound extraction pins run only where the licensed
# export exists, which means `bin/commit` stays mandatory before a push — CI cannot see those.
#
# ONE EXCEPTION, THE MECHANICAL RE-SYNC (operator 2026-11-11, approving item 2: "yes, approve 1–4"):
# a merge from main whose conflicts are ONLY extraction-version rows and their drift pins, STATE.md
# rows or fix-log rows, and which changes no other code, is gated by THIS workflow alone, after the
# four shared-file tests run locally (test_state_identifiers, test_state_open_now, test_fix_log,
# test_extraction_version_drift). A re-sync touching any other code still goes through `bin/commit`.
# The accepted risk (main's code meets the branch's away from the CIQ-bound pins) and its falsifier
# (the full local suite on main after each merge batch): docs/records/2026-11-11-fix2-bookkeeping-
# batch-2-and-faster-fixes.md.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency: # a force-push supersedes its own in-flight run rather than queueing behind it
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # FULL HISTORY, not the default depth-1: `test_state_identifiers.py` validates the S/D
          # identifier lint against a REAL historical collision (commit c112f25) and skips itself
          # when that commit is unreachable. At depth 1 the test guarding STATE.md would silently
          # skip on every PR that edits STATE.md — a gate that cannot fire, which is the defect
          # class this whole PR is about.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # FROM THE LOCK (operator, 2026-11-13: "Check, then pin newest (Recommended)"): every package
      # at the version requirements.lock pins, each checked by its hash, then the package itself
      # with nothing added. Before this, each run resolved the newest of everything: the theme
      # desk's paid runs here installed anthropic 1.17.0, 2.3.0 and 2.6.0 in three weeks.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps -e .

      # Each step is its own `run` so a red names WHICH check failed in the job summary, rather
      # than one opaque script. Never piped — a pipe consumes the exit status (D16).
      - name: ruff
        run: python -m ruff check vinci tests frontend
      - name: mypy --strict
        run: python -m mypy --strict vinci
      # `-rs` prints every skip's reason in the log: the CIQ-bound tests skip here by design, and a
      # skip count with no reasons cannot say which half of the suite this runner actually checked.
      # `-n auto` (pytest-xdist, from the lock) spreads the same tests over the runner's cores: one
      # process spent 758-1416 s here, 95% of the job. It is the one flag the other gates may leave
      # out (`tests/test_one_gate.py`): `bin/commit` does, because the shared venv it runs in has
      # no pytest-xdist until re-synced from the lock, and the scheduled workflows' gates do.
      # Every test runs on both: docs/records/2026-11-13-the-gate-runs-the-suite-across-workers.md
      #
      # A TEST WRITES NO FILE INTO THE CHECKOUT (2026-11-14). On workers, a test that rewrites a
      # committed file, even one it restores byte for byte, can be read mid-write by a test on
      # another worker: a failure that comes and goes, which #1065 accepted as a risk. git cannot
      # see it, because a restored file leaves `git status` clean. So the time is marked before the
      # tests, and any file whose STATUS changed after the mark (`-cnewer`: its ctime, which every
      # write, rename, chmod or utime moves and no call sets back, so a restore that copies the old
      # modification time back with `shutil.copy2` is caught too) fails the job, by name. Left
      # out: the caches a real run of the suite writes, measured, not guessed — `.pytest_cache`,
      # `.hypothesis` and every `__pycache__` (ruff's and mypy's are written before the mark).
      # CI only: on a person's machine a file they edit during the run would trip it too, so
      # `bin/commit` has no such step. The measurement and what it does not catch:
      # docs/records/2026-11-14-the-gate-names-a-test-that-writes-into-the-checkout.md
      - name: mark the time before the tests
        run: touch "$RUNNER_TEMP/before-the-tests"
      - name: pytest (offline)
        id: pytest
        run: python -m pytest -m "not network" -p no:warnings --tb=short -rs -n auto
      - name: the tests wrote no file into the checkout
        if: ${{ !cancelled() && steps.pytest.outcome != 'skipped' }}
        run: |
          # A step with no `shell:` runs under `bash -e`, with no pipefail: without this line a
          # find that fails part-way would hand its partial list to `sort` and the step pass (D16).
          # `-cnewer`, never `-newer`: a modification time can be set back, a status time cannot.
          set -euo pipefail
          since="$RUNNER_TEMP/before-the-tests"
          newer=$(( $(find . -path ./.git -prune -o ! -type d -cnewer "$since" -print | wc -l) ))
          written="$(find . \( -path ./.git -o -path ./.pytest_cache -o -path ./.hypothesis \
            -o -name __pycache__ \) -prune -o ! -type d -cnewer "$since" -print | sort)"
          if [ "$newer" -eq 0 ]; then
            echo "::error::no file is newer than the mark, not even in the caches: this check cannot see the run"
            exit 1
          fi
          if [ -n "$written" ]; then
            echo "::error::the tests wrote $(( $(printf '%s\n' "$written" | wc -l) )) file(s) into the checkout: on workers, another test can read one mid-write"
            printf '%s\n' "$written"
            exit 1
          fi
          echo "$newer files are newer than the mark, every one in .pytest_cache, .hypothesis or a __pycache__"

      # THE MIRROR IS DERIVED, AND NOTHING WAS ENFORCING THAT. `frontend/` is rebuilt from
      # committed data by `frontend/build.py`, but the rebuild ran only when a human remembered —
      # so a PR could change `data/snapshots/` or `data/monitor/` and ship a deployed site still
      # showing the previous state, with a green gate. Cloudflare Pages serves `frontend/` as
      # committed, so a stale mirror IS the product.
      #
      # A CHECK, NOT AN AUTO-COMMIT: this job has `contents: read`, and a workflow that pushed
      # generated files back would make main a moving target mid-review. The build is a no-op on
      # committed data — it SKIPS every local-only source rather than deleting that source's
      # mirror — so any diff here means the author changed data and did not rebuild.
      - name: frontend mirror is in sync with committed data
        run: |
          python frontend/build.py
          git diff --exit-code -- frontend/ || {
            echo "::error::frontend/ is stale — run 'python frontend/build.py' and commit the result"
            exit 1
          }
          test -z "$(git status --porcelain -- frontend/)" || {
            echo "::error::frontend/ gained untracked files — run the build locally and commit them"
            git status --porcelain -- frontend/
            exit 1
          }
