name: monthly-score

# Configure once, runs forever: on the 1st of each month it scores the decision ledger
# (the BUY−AVOID spread + supporting metrics) and commits the report back.
on:
  schedule:
    - cron: "0 7 1 * *" # 1st of the month, 07:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: vinci-scheduled
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # `[dev]` for the pre-push gate below — this job now runs the offline suite itself.
          python -m pip install -e ".[dev]"

      - name: Restore EOD cache
        uses: actions/cache@v4
        with:
          path: data/cache
          key: vinci-eod-cache-${{ github.run_id }}
          restore-keys: vinci-eod-cache-

      - name: Run monthly scoring
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python -m vinci run-monthly

      - name: Rebuild the derived frontend mirror
        run: python frontend/build.py

      # SAME GATE, SAME REASON AS `weekly-screen.yml` — read the long note there. This job commits
      # the scoring report, the surface the BUY−AVOID spread is READ from, so a pass that breaks a
      # pin must fail here rather than on the next unrelated PR.
      - name: Gate the refreshed artifacts before they can reach main
        run: |
          if [ -f data/vinci.db ]; then mv data/vinci.db "$RUNNER_TEMP/vinci.db"; fi
          python -m pytest -m "not network" -p no:warnings --tb=short

      - name: Commit scoring report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/snapshots frontend
          git diff --staged --quiet || git commit -m "monthly score: update report"
          git push
