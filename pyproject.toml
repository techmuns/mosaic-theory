[project]
name = "vinci"
version = "0.1.0"
description = "Loop 1 — first production slice of an AI-native, long-only US equity research engine (paper mode)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Munshot Research" }]
dependencies = [
    "pydantic>=2.11",
    "httpx>=0.27",
    "python-dotenv>=1.0",  # auto-load repo-root .env locally; no-op in CI (12-factor config)
    "striprtf>=0.0.26",   # CIQ Business Relationships exports (real RTF)
    # EXACT, and locked with every other package in requirements.lock (operator, 2026-11-13: "Check,
    # then pin newest (Recommended)"; coordinator default 7). Every LLM phase sends through this
    # SDK. A $0 check sent the same request through 0.112.0 and 2.6.0 (every page's synthesis and
    # confirmation, the judge, the theme desk, validate-keys): 452 bodies, every byte identical.
    # THE UPGRADE RULE: a bump is a PR that first repeats that $0 check (the record names its
    # method) and shows every body byte-identical, or names what moved; never a bare edit here.
    # THE LOCK IS REGENERATED IN PLACE: uv reads the committed requirements.lock as its preferences,
    # so `--upgrade-package anthropic==<X>` moves the SDK and its own dependencies only. Into an
    # empty file the same command takes the newest of everything (24 of 52 pins moved, 2026-11-13).
    # docs/records/2026-11-13-the-anthropic-sdk-is-pinned-at-2-6-0-behind-a-byte-check.md
    "anthropic==2.6.0",
    "beautifulsoup4>=4.12",  # 10-K HTML → text for the graph extractor
    "xlrd>=2.0",          # legacy .xls (BIFF) CIQ Financials/Estimates workbooks (dossier)
    "openpyxl>=3.1",      # .xlsx CIQ exports — `ciq.read_sheets` has an OOXML branch (audit H-D3)
    "pdfplumber>=0.11,<0.12",  # theme intelligence: manually supplied research PDFs (text, tables, pages)
    "duckdb>=2.0",        # the fact layer's reader (vinci/facts): embedded, in memory, read-only
    "pyarrow==26.0.1",    # the fact layer's writer, PINNED: its bytes embed the version (store.py)
]

[project.optional-dependencies]
# Pulled in only when the scoring harness (step 7) is built, to keep the
# early-step install minimal and avoid bleeding-edge wheel friction.
scoring = [
    "numpy>=1.26",
    "pandas>=2.2",
    "statsmodels>=0.14",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "hypothesis>=6.100",  # as-of invariance properties (tests/test_as_of_properties.py)
    "xlwt>=1.3",          # writes the synthetic BIFF CIQ fixtures (tests/fixtures/ciq_synthetic)
]

[project.scripts]
vinci = "vinci.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vinci"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# pyflakes, pycodestyle, isort, bugbear, comprehensions, pyupgrade, naming
select = ["F", "E", "W", "I", "B", "C4", "UP", "N", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "network: tests that hit live external APIs (SEC EDGAR, Polygon); deselect with -m 'not network'",
]
